services:
  - type: web
    name: openfranz-worker
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm exec tsx worker/ingest-worker.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.6.0
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: DATABASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: RENDI_API_KEY
        sync: false
      - key: INGEST_WORKER_SECRET
        sync: false
